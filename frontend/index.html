<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">Study Hub</div>
    </nav>

    <!-- HOŞGELDİN + TAB'LI FORM -->
    <section class="welcome-section">
        <div class="welcome-card">
            <h1>Hoş Geldiniz! 👋</h1>
            <p class="welcome-subtitle">Study Hub'a giriş yapın veya yeni hesap oluşturun.</p>

            <!-- Tab butonları -->
            <div class="tab-buttons">
                <button class="tab-btn active" id="loginTab">Giriş Yap</button>
                <button class="tab-btn" id="registerTab">Kaydol</button>
            </div>

            <!-- Login formu -->
            <form id="loginForm" class="tab-content active">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="ornek@universite.edu">
                </div>
                <div class="form-group">
                    <label for="password">Şifre</label>
                    <input type="password" id="password" placeholder="Şifrenizi girin">
                </div>
                <button type="submit" class="btn-submit">Giriş Yap</button>
            </form>

            <!-- Register formu -->
            <form id="registerForm" class="tab-content" style="display:none;">
                <div class="form-group">
                    <label for="fullname">Ad Soyad</label>
                    <input type="text" id="fullname" placeholder="Adınız Soyadınız">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="ornek@universite.edu">
                </div>
                <div class="form-group">
                    <label for="university">Üniversite</label>
                    <select id="university">
                        <option value="IBU">International Balkan University</option>
                        <option value="Bilkent">Bilkent University</option>
                        <option value="Bogazici">Boğaziçi University</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="regPassword">Şifre</label>
                    <input type="password" id="regPassword" placeholder="En az 6 karakter">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Şifre Tekrar</label>
                    <input type="password" id="confirmPassword" placeholder="Şifrenizi tekrar girin">
                </div>
                <button type="submit" class="btn-submit">Kaydol</button>
            </form>
        </div>
    </section>

    <!-- SCRIPTLER -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        /* Tab değiştirme - Giriş Yap / Kaydol arasında geçiş */
        $('#loginTab').on('click', function() {
            $(this).addClass('active');
            $('#registerTab').removeClass('active');
            $('#loginForm').show();
            $('#registerForm').hide();
        });
        $('#registerTab').on('click', function() {
            $(this).addClass('active');
            $('#loginTab').removeClass('active');
            $('#registerForm').show();
            $('#loginForm').hide();
        });
    </script>

</body>
</html>
