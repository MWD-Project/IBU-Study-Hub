<!DOCTYPE html> <!-- Tarayıcıya bunun HTML5 dosyası olduğunu söyler -->
<html lang="en"> <!-- Sayfa dilini İngilizce olarak ayarlar -->
<head>
    <meta charset="UTF-8"> <!-- Özel karakterlerin düzgün görünmesi için -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobilde düzgün görünsün diye -->
    <title>Study Hub | Dashboard</title> <!-- Tarayıcı sekmesinde görünen başlık -->
    <link rel="stylesheet" href="css/style.css"> <!-- Ortak style.css dosyasını bağlar -->
</head>
<body> <!-- Sayfada görünen her şey body içine yazılır -->
<!-- ARKA PLAN SLIDESHOW - Üniversiteye göre değişen fotoğraflar -->
<div id="bgSlideshow"></div>
    <!-- NAVBAR - Giriş yapılmış kullanıcı için navbar -->
    <nav class="navbar">
        <div class="logo">Study Hub</div> <!-- Sol taraftaki logo -->
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li> <!-- Dashboard sayfası -->
            <li><a href="resources.html">Resources</a></li> <!-- Kaynaklar sayfası -->
            <li><a href="upload.html">Upload</a></li> <!-- Materyal yükleme sayfası -->
            <li><a href="index.html" class="btn-logout">Logout</a></li> <!-- Çıkış yapar, ana sayfaya döner -->
        </ul>
    </nav>

    <!-- DASHBOARD HEADER - Kullanıcıya hoşgeldin mesajı -->
     <!-- Üst karşılama bölümü -->
        <!-- DASHBOARD HEADER - Başlık ve Browse Materials butonu -->
<section class="dashboard-header">
    <div> <!-- Sol taraf - başlık ve açıklama -->
        <h1>Welcome back, <span></span> 👋</h1>
        <p id="universityLabel">Here's what's new on your campus today.</p>
    </div>
    <!-- Sağ taraf - Browse Materials butonu -->
    <a href="materials-menu.html" class="btn-browse">Browse Materials →</a>
</section>

    <!-- İSTATİSTİK KARTLARI - Backend'den gelen gerçek veriler -->
    <section class="stats-section"> <!-- İstatistik kartlarının bölümü -->
        <div class="stats-grid"> <!-- Kartları yan yana dizen grid -->

            <!-- 1. İstatistik - Kendi üniversitesindeki toplam materyal -->
            <div class="stat-card">
                <p class="stat-label">Total Materials</p> <!-- Kart açıklaması -->
                <h3 class="stat-number stat-total">...</h3> <!-- main.js #stat-total ile doldurulur -->
            </div>

            <!-- 2. İstatistik - Kullanıcının yüklediği materyal sayısı -->
            <div class="stat-card">
                <p class="stat-label">My Uploads</p> <!-- Kart açıklaması -->
                <h3 class="stat-number stat-mine">...</h3> <!-- main.js #stat-mine ile doldurulur -->
            </div>

            <!-- 3. İstatistik - Notes sayısı (placeholder) -->
            <div class="stat-card">
                <p class="stat-label">Notes</p>
                <h3 class="stat-number stat-notes">0</h3>
            </div>

            <!-- 4. İstatistik - Past Exams sayısı (placeholder) -->
            <div class="stat-card">
                <p class="stat-label">Past Exams</p>
                <h3 class="stat-number stat-exams">0</h3>
            </div>

        </div>
    </section>

    <!-- SON YÜKLENEN MATERYALLER - Backend'den çekilir, kendi üniversitesindekiler -->
    <section class="resources-section"> <!-- Kartları içeren bölüm -->
        <div class="section-header"> <!-- Başlık ve buton yan yana -->
            <h2>Recently Uploaded</h2> <!-- Bölüm başlığı -->
            <a href="resources.html" class="see-all">See all →</a> <!-- Tüm kaynaklar sayfasına gider -->
        </div>

        <div class="cards-grid" id="recentGrid"> <!-- main.js #recentGrid'e kartları ekler -->
            <p style="color:#888;">Loading...</p> <!-- Veri yüklenene kadar gösterilir -->
        </div>
    </section>

    <!-- SCRIPTLER - Sayfa yüklendikten sonra çalışsın diye en alta -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script> <!-- jQuery kütüphanesi -->
    <script src="js/main.js"></script> <!-- Kendi JS dosyamız -->
</body>
</html>
